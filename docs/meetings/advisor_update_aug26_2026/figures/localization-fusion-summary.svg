<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Response-level and token-level fusion for localization</title>
  <desc id="desc">The shared localization architecture and ablations showing that most performance comes from token-level fusion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
      .sub{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#536079}
      .box{fill:#fff;stroke:#ccd9e8;stroke-width:1.5}
      .box-blue{fill:#edf4ff;stroke:#7ca3d1;stroke-width:1.8}
      .box-green{fill:#edf8f3;stroke:#58a487;stroke-width:1.8}
      .h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#27334d}
      .label{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#45516a}
      .small{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#68748a}
      .value{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
      .arrow{stroke:#6c7c92;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .bar-response{fill:#aab5c4}.bar-token{fill:#3d9b78}.bar-combined{fill:#4f7cac}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6c7c92"/></marker>
  </defs>
  <rect width="1100" height="650" rx="24" fill="url(#bg)"/>
  <text x="42" y="48" class="title">Localization is a two-level fusion problem</text>
  <text x="42" y="76" class="sub">Thirteen answer-level methods share one token-IU29 localizer; the tasks use the two levels differently.</text>

  <rect x="40" y="112" width="245" height="112" rx="16" class="box-blue"/>
  <text x="62" y="143" class="h">Response-level fusion</text>
  <text x="62" y="171" class="label">13 methods, later CIW-DEEM</text>
  <text x="62" y="195" class="small">Does the complete trace look wrong?</text>

  <rect x="40" y="246" width="245" height="134" rx="16" class="box-green"/>
  <text x="62" y="277" class="h">Token-level fusion</text>
  <text x="62" y="305" class="label">29 uncertainty trajectories</text>
  <text x="62" y="329" class="small">IU-PCR risk for every token</text>
  <text x="62" y="352" class="small">Step risk = maximum token risk</text>

  <rect x="387" y="130" width="275" height="105" rx="16" class="box"/>
  <text x="410" y="161" class="h">ProcessBench</text>
  <text x="410" y="189" class="label">Combine response + step ranks</text>
  <text x="410" y="212" class="small">Predict first error or no error</text>
  <path d="M285 168 C330 168 342 168 387 177" class="arrow"/>
  <path d="M285 311 C340 311 338 221 387 199" class="arrow"/>

  <rect x="387" y="268" width="275" height="105" rx="16" class="box"/>
  <text x="410" y="299" class="h">PRMBench</text>
  <text x="410" y="327" class="label">Use token/step risk directly</text>
  <text x="410" y="350" class="small">Classify every reasoning step</text>
  <path d="M285 324 C332 324 345 320 387 320" class="arrow"/>

  <rect x="700" y="112" width="360" height="268" rx="18" class="box"/>
  <text x="725" y="144" class="h">Where does the performance come from?</text>
  <text x="725" y="173" class="label">ProcessBench macro F1</text>
  <text x="725" y="207" class="small">Response only</text><rect x="835" y="190" width="104" height="22" rx="6" class="bar-response"/><text x="949" y="207" class="value">17–19%</text>
  <text x="725" y="244" class="small">Token only</text><rect x="835" y="227" width="160" height="22" rx="6" class="bar-token"/><text x="1005" y="244" class="value">29.44%</text>
  <text x="725" y="281" class="small">Best combined</text><rect x="835" y="264" width="169" height="22" rx="6" class="bar-combined"/><text x="1014" y="281" class="value">31.07%</text>
  <text x="725" y="326" class="label">PRMBench every-step AUROC</text>
  <text x="725" y="356" class="small">Token only 0.6712  &gt;  best combined 0.6493</text>

  <rect x="40" y="424" width="1020" height="168" rx="18" class="box"/>
  <text x="65" y="458" class="h">Interpretation</text>
  <text x="65" y="491" class="label">The token head supplies most of the localization signal.</text>
  <text x="65" y="519" class="label">The response head helps ProcessBench decide whether to abstain, but it can dilute PRMBench's step ranking.</text>
  <text x="65" y="547" class="label">CIW-DEEM changed only the response head and remained tied with B3; token-native innovation is still untested.</text>
  <text x="65" y="575" class="small">This motivates new-data validation of localization and a direct CIW-style model over token trajectories.</text>
  <text x="42" y="627" class="small">All values are from the frozen same-access localization reconstruction; CIW transfer is a later compatible follow-up.</text>
</svg>
