<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Algorithmic results summary</title>
  <desc id="desc">Frozen aligned answer benchmark, Family-NRM reserved PRMBench gain, and CIW-DEEM promotion result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#536079}.panel{fill:#fff;stroke:#dce5f2;stroke-width:1.5}.h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#27334d}.label{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#45516a}.value{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.note{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#68748a}.axis{stroke:#cad4e4}.base{fill:#a6b2c8}.iu{fill:#4f7cac}.dufs{fill:#6c9bd2}.good{fill:#2d9d78}.chall{fill:#e3a12b}.bad{fill:#d85c5c}.tag{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1100" height="560" rx="24" fill="url(#bg)"/>
  <text x="42" y="50" class="title">Algorithmic direction: what moved, and what did not</text>
  <text x="42" y="78" class="sub">Graphs were stable but largely target-neutral; residual contribution space produced the clearest bounded gain.</text>

  <rect x="35" y="108" width="500" height="388" rx="18" class="panel"/>
  <text x="62" y="143" class="h">Frozen 24-cell answer benchmark · macro AUROC</text>
  <line x1="190" y1="178" x2="494" y2="178" class="axis"/>
  <text x="190" y="198" class="note">0.770</text><text x="462" y="198" class="note">0.775</text>
  <text x="62" y="236" class="label">Deployed U-PCR</text><rect x="190" y="215" width="214" height="28" rx="7" class="base"/><text x="414" y="236" class="value">0.77353</text>
  <text x="62" y="292" class="label">IU-PCR</text><rect x="190" y="271" width="247" height="28" rx="7" class="iu"/><text x="447" y="292" class="value">0.77406</text>
  <text x="62" y="348" class="label">DUFS-LIU</text><rect x="190" y="327" width="252" height="28" rx="7" class="dufs"/><text x="452" y="348" class="value">0.77414</text>
  <text x="62" y="404" class="label">Balanced atomic CA</text><rect x="190" y="383" width="261" height="28" rx="7" class="good"/><text x="461" y="404" class="value">0.77429</text>
  <rect x="62" y="444" width="165" height="28" rx="14" fill="#6c9bd2"/><text x="78" y="463" class="tag">IU ≈ DUFS-LIU</text>
  <text x="239" y="463" class="note">Adding a Laplacian did not create a meaningful gain.</text>

  <rect x="558" y="108" width="507" height="180" rx="18" class="panel"/>
  <text x="584" y="143" class="h">Family-NRM · reserved PRMBench responses</text>
  <text x="584" y="184" class="label">IU baseline</text><text x="735" y="184" class="value">0.7206</text>
  <text x="584" y="220" class="label">Family-NRM</text><text x="735" y="220" class="value">0.7252</text>
  <rect x="864" y="164" width="164" height="48" rx="12" class="good"/>
  <text x="884" y="194" class="tag">+0.46 AUROC pt</text>
  <text x="584" y="256" class="note">Positive grouped interval · bounded to manual families and donor calibration.</text>

  <rect x="558" y="309" width="507" height="187" rx="18" class="panel"/>
  <text x="584" y="344" class="h">Latest B3-family challenger · equal-family AUROC</text>
  <text x="584" y="386" class="label">Frozen B3</text><text x="735" y="386" class="value">0.74850</text>
  <text x="584" y="422" class="label">CIW-DEEM</text><text x="735" y="422" class="value">0.74923</text>
  <rect x="864" y="365" width="164" height="48" rx="12" class="chall"/>
  <text x="882" y="395" class="tag">+0.073 pt</text>
  <text x="584" y="458" class="note">Below +0.25-point promotion gate; sign-flip p=0.137.</text>
  <text x="876" y="458" class="note">CHALLENGER</text>
  <text x="42" y="530" class="note">Interpretation: move from sample graphs toward separating shared structure from innovation before nonlinear fusion.</text>
</svg>
