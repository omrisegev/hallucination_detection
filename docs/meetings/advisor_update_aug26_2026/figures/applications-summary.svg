<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Application results worth taking forward</title>
  <desc id="desc">First-error localization and fixed-prefix prediction are the two positive application results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fffc"/><stop offset="1" stop-color="#edf8f4"/></linearGradient>
    <style>.title{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#536079}.panel{fill:#fff;stroke:#d8e9e2;stroke-width:1.5}.h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#27334d}.label{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#45516a}.value{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.note{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#68748a}.good{fill:#2d9d78}.base{fill:#9aa8b9}.tag{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}</style>
  </defs>
  <rect width="1100" height="410" rx="24" fill="url(#bg)"/>
  <text x="42" y="50" class="title">Applications worth taking forward</text>
  <text x="42" y="78" class="sub">The clearest results are first-error localization and prediction from incomplete reasoning prefixes.</text>

  <rect x="35" y="108" width="500" height="226" rx="18" class="panel"/>
  <text x="62" y="143" class="h">First-error localization · ProcessBench macro F1</text>
  <text x="62" y="190" class="label">Mind-the-Gap control</text><rect x="228" y="169" width="154" height="28" rx="7" class="base"/><text x="393" y="190" class="value">25.71%</text>
  <text x="62" y="242" class="label">Our GL-LIU</text><rect x="228" y="221" width="188" height="28" rx="7" class="good"/><text x="427" y="242" class="value">31.36%</text>
  <rect x="62" y="275" width="116" height="28" rx="14" class="good"/><text x="80" y="294" class="tag">8 / 8 CELLS</text>
  <text x="192" y="294" class="note">Token-level fusion supplies most of the gain.</text>

  <rect x="558" y="108" width="507" height="226" rx="18" class="panel"/>
  <text x="584" y="143" class="h">Fixed-prefix prediction · ProcessBench AUROC</text>
  <text x="584" y="188" class="label">64 tokens</text><text x="688" y="188" class="note">0.5629</text><rect x="753" y="169" width="116" height="24" rx="6" class="base"/><text x="885" y="188" class="value">0.5955</text>
  <text x="584" y="238" class="label">256 tokens</text><text x="688" y="238" class="note">0.6114</text><rect x="753" y="219" width="152" height="24" rx="6" class="base"/><text x="921" y="238" class="value">0.6572</text>
  <text x="584" y="278" class="note">Gray bar/value = Unified-28; bold value = selected two-head model.</text>
  <text x="584" y="306" class="note">Both paired intervals are above zero.</text>

  <text x="42" y="375" class="note">Stopping and RAG were also tested, but neither currently supports a central positive claim; full results remain in the deep dive.</text>
</svg>
